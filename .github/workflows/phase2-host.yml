name: Phase 2 - host decompiler proof

# Host (x86_64 Linux) test of the REAL Ghidra decompiler on a REAL AArch64 ELF.
# This validates the pipeline logic. It is NOT an Android test.

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/phase2-host.yml'

env:
  GHIDRA_COMMIT: 164003036607e669226647bd0f7bedaf281e56a6

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu zlib1g-dev

      - name: Fetch pinned upstream Ghidra (sparse)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NationalSecurityAgency/ghidra.git ghidra
          cd ghidra
          git sparse-checkout set Ghidra/Features/Decompiler Ghidra/Processors/AARCH64 Ghidra/Processors/x86
          git checkout "$GHIDRA_COMMIT"
          git log -1 --format='%H %cd'

      - name: Build SLEIGH compiler (upstream Makefile)
        working-directory: ghidra/Ghidra/Features/Decompiler/src/decompile/cpp
        run: make -j"$(nproc)" OPT_CXXFLAGS="-O1 -Wno-sign-compare" sleigh_opt

      - name: Compile processor specs to .sla
        run: |
          SLEIGH="$PWD/ghidra/Ghidra/Features/Decompiler/src/decompile/cpp/sleigh_opt"
          mkdir -p specs
          for p in AARCH64 x86; do cp ghidra/Ghidra/Processors/$p/data/languages/*.ldefs ghidra/Ghidra/Processors/$p/data/languages/*.pspec ghidra/Ghidra/Processors/$p/data/languages/*.cspec specs/; done
          "$SLEIGH" ghidra/Ghidra/Processors/AARCH64/data/languages/AARCH64.slaspec specs/AARCH64.sla
          "$SLEIGH" ghidra/Ghidra/Processors/x86/data/languages/x86-64.slaspec specs/x86-64.sla
          ls -la specs/*.sla

      - name: Build real console decompiler (no libbfd)
        run: ./native/build_console.sh "$PWD/ghidra" "$PWD/out"

      - name: Build AArch64 and x86-64 test ELFs
        run: |
          F="-O1 -fno-stack-protector -fno-asynchronous-unwind-tables -nostdlib -static -fno-pie -no-pie"
          aarch64-linux-gnu-gcc $F -o sample_aarch64 tests/sample.c
          gcc $F -o sample_x64 tests/sample.c
          file sample_aarch64 sample_x64 || true

      - name: Decompile AArch64 ELF with the real decompiler
        run: |
          FUNCS="sum_squares sum_to_n_squared fnv1a clamp_sum"
          python3 tools/elf2xml.py sample_aarch64 "AARCH64:LE:64:v8A:default" "$PWD/a64.xml" a64.script $FUNCS
          ./out/decomp_console -s "$PWD/specs" < a64.script 2>&1 | tee a64.out

      - name: Decompile x86-64 ELF (cross-check)
        run: |
          FUNCS="sum_squares sum_to_n_squared fnv1a clamp_sum"
          python3 tools/elf2xml.py sample_x64 "x86:LE:64:default:gcc" "$PWD/x64.xml" x64.script $FUNCS
          ./out/decomp_console -s "$PWD/specs" < x64.script 2>&1 | tee x64.out

      - name: Check results
        run: |
          for f in a64.out x64.out; do
            for fn in sum_squares sum_to_n_squared fnv1a clamp_sum; do
              grep -q "$fn" $f || { echo "MISSING $fn in $f"; exit 1; }
            done
            grep -qE 'return|while|for \(' $f || { echo "no C control flow in $f"; exit 1; }
          done
          echo "## Real decompiler output (AArch64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```c' >> "$GITHUB_STEP_SUMMARY"; cat a64.out >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-host-output
          path: |
            a64.out
            x64.out
            a64.xml
            out/sources.txt
